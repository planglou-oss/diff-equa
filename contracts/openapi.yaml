openapi: 3.1.0
info:
  title: EE Math I API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /questions/{id}/choices:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      description: Four source-backed options with stable IDs and a content version. Does not return the answer key. An unprepared question or changed source returns available=false.
      responses:
        '200':
          description: Choice set or unavailable message
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available: {type: boolean}
                  message: {type: string}
                  version: {type: string}
                  prompt: {type: string}
                  sourceLabel: {type: string}
                  options:
                    type: array
                    minItems: 4
                    maxItems: 4
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        latex: {type: string}
        '404': {$ref: '#/components/responses/Error'}
  /choices/check:
    post:
      description: Grades selected IDs against authored original-solution keys without AI. Answer token is mcq:version:optionId. Used after manual submission or practice completion; not a secure proctored exam API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [questionId, answer]
                    properties:
                      questionId: {type: string}
                      answer: {type: string}
      responses:
        '200':
          description: Counts correct/wrong/unanswered/ungraded/total and per-question status (correct/wrong/unanswered/unavailable/legacy/stale). Graded results include correctOptionId/correctLatex/feedback/explanation/sourceUrl. Legacy/stale/unavailable answers are ungraded rather than wrong.
        '400': {$ref: '#/components/responses/Error'}
  /guides:
    get:
      responses:
        '200':
          description: Authored formulas, topic hints, verification checklists, and selected question hints. These are study guidance, not generated/graded answers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {type: object}}
                  questionHints:
                    type: object
                    additionalProperties: {type: array, items: {type: string}}
  /practice/sets:
    post:
      description: Returns random unique questions. Personal progress stays in the browser; include/exclude IDs select the eligible pool.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [count]
              properties:
                count: {type: integer, minimum: 1, maximum: 50}
                mode: {type: string, enum: [choice], description: Restrict to questions with four source-backed options. Omit for the legacy unrestricted pool.}
                topicId: {type: integer, minimum: 0, maximum: 9, default: 0}
                includeIds: {type: array, maxItems: 500, items: {type: string}, description: An empty array selects no questions; omit to allow all.}
                excludeIds: {type: array, maxItems: 500, items: {type: string}}
      responses:
        '200':
          description: May contain fewer questions than requested when the eligible pool is small.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Question'}}
                  available: {type: integer}
                  requestedCount: {type: integer}
        '400': {$ref: '#/components/responses/Error'}
  /questions/{id}/reports:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    post:
      security: [{browserSession: []}]
      description: Stores an error report locally on the Go server; it does not change review status or send external notifications. Limited to 20 per session per hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, description]
              properties:
                kind: {type: string, enum: [question, original_solution, ai_explanation, guide]}
                description: {type: string, minLength: 3, maxLength: 2000}
      responses:
        '201':
          description: Recorded with report ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  status: {type: string, const: recorded}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /health:
    get:
      responses:
        '200':
          description: Process is serving HTTP
  /catalog:
    get:
      responses:
        '200':
          description: Global topic counts, filters, and AI availability
          content:
            application/json:
              schema:
                type: object
                required: [topics, years, examTypes, aiAvailable]
                properties:
                  topics:
                    type: array
                    items:
                      type: object
                      required: [id, name, totalCount]
                      properties:
                        id: {type: integer}
                        name: {type: string}
                        totalCount: {type: integer}
                  years: {type: array, items: {type: integer}}
                  examTypes: {type: array, items: {type: string}}
                  aiAvailable: {type: boolean}
  /questions:
    get:
      parameters:
        - {name: sort, in: query, schema: {type: string, enum: [default, year_asc, year_desc]}, description: 'Orders the full filtered result before pagination. Equal years use topic, question number, then ID.'}
        - {name: choiceOnly, in: query, schema: {type: string, enum: ['1']}, description: Restrict to source-backed four-option questions.}
        - {name: topicId, in: query, schema: {type: integer, minimum: 1}}
        - {name: year, in: query, schema: {type: integer, minimum: 1}}
        - {name: examType, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 100000, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: ids, in: query, schema: {type: string}, description: 'Comma-separated question IDs, maximum 500. Empty selects none.'}
        - {name: excludeIds, in: query, schema: {type: string}, description: 'Comma-separated question IDs to exclude, maximum 500.'}
      responses:
        '200':
          description: AND-filtered results sorted by topic, display number, ID
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, pageSize]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Question'}}
                  total: {type: integer}
                  page: {type: integer}
                  pageSize: {type: integer}
        '400': {$ref: '#/components/responses/Error'}
  /questions/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      responses:
        '200':
          description: Question metadata and image
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Question'}
        '404': {$ref: '#/components/responses/Error'}
  /questions/{id}/context:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      responses:
        '200':
          description: Editable text context. Unreviewed legacy OCR may contain damaged formulas or solution fragments; diagrams require a textual description.
          content:
            application/json:
              schema:
                type: object
                required: [questionId, text, source, reviewStatus]
                properties:
                  questionId: {type: string}
                  text: {type: string}
                  source: {type: string, enum: [legacy_ocr, transcribed]}
                  reviewStatus: {type: string, enum: [unreviewed, reviewed]}
        '404': {$ref: '#/components/responses/Error'}
  /questions/{id}/solutions:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      responses:
        '200':
          description: Original image and optional imported AI explanation
          content:
            application/json:
              schema:
                type: object
                required: [original, aiExplanation]
                properties:
                  original: {$ref: '#/components/schemas/Image'}
                  aiExplanation:
                    oneOf:
                      - {type: 'null'}
                      - type: object
                        required: [bodyHtml, reviewStatus, origin]
                        properties:
                          bodyHtml: {type: string, description: Sanitize before browser rendering}
                          reviewStatus: {type: string, enum: [unreviewed, reviewed, ai_checked, needs_clarification], description: 'AI checks are distinct from human review; needs_clarification flags inconsistent problem data.'}
                          origin: {type: string, const: imported_ai}
        '404': {$ref: '#/components/responses/Error'}
  /session:
    post:
      description: Creates or reuses an HttpOnly anonymous session cookie. No body required.
      responses:
        '200': {description: Existing session reused}
        '201': {description: New session cookie set}
        '403': {$ref: '#/components/responses/Error'}
  /conversations:
    post:
      security: [{browserSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [questionId]
              properties:
                questionId: {type: string}
      responses:
        '201':
          description: New question-scoped conversation
          content:
            application/json:
              schema:
                type: object
                required: [id, questionId]
                properties:
                  id: {type: string}
                  questionId: {type: string}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /conversations/{id}/messages:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      security: [{browserSession: []}]
      responses:
        '200':
          description: Messages in creation order; partial answers marked interrupted
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, role, content, status]
                      properties:
                        id: {type: string}
                        role: {type: string, enum: [user, assistant]}
                        content: {type: string}
                        status: {type: string, enum: [streaming, completed, interrupted]}
        '404': {$ref: '#/components/responses/Error'}
    post:
      security: [{browserSession: []}]
      description: |
        POST using fetch, then read SSE response. Events:
        start {messageId}, delta {text}, done {messageId,status},
        error {code,message,requestId}. Client must receive done to consider
        the answer complete. Replaying a completed clientRequestId returns
        saved start/delta/done without another provider call. Errors after
        headers are SSE error events. Disconnect cancels generation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message, clientRequestId]
              properties:
                message: {type: string, minLength: 1, maxLength: 4000}
                clientRequestId: {type: string, minLength: 8, maxLength: 100}
                questionText: {type: string, minLength: 1, maxLength: 6000, description: Optional edited text for the selected question. Omit to use server text context. Images and original solution attachments are never sent to the AI provider.}
      responses:
        '200':
          description: SSE answer stream
          content:
            text/event-stream:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    browserSession: {type: apiKey, in: cookie, name: ee_session}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string}}
  responses:
    Error:
      description: Request rejected or failed
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message, requestId]
                properties:
                  code: {type: string}
                  message: {type: string}
                  requestId: {type: string}
  schemas:
    Image:
      type: object
      required: [url, width, height]
      properties:
        url: {type: string}
        width: {type: integer}
        height: {type: integer}
    Question:
      type: object
      required: [id, topicId, topic, displayNumber, examType, examTypeRaw, dateLabel, year, sourceLabel, questionImage, hasOriginalSolution, hasAIExplanation]
      properties:
        id: {type: string}
        topicId: {type: integer}
        topic: {type: string}
        displayNumber: {type: integer}
        examType: {type: string}
        examTypeRaw: {type: string}
        dateLabel: {type: string}
        year: {type: integer}
        sourceLabel: {type: string}
        questionImage: {$ref: '#/components/schemas/Image'}
        hasOriginalSolution: {type: boolean}
        hasAIExplanation: {type: boolean}
        tags: {type: array, items: {type: string}}
